<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ store.name }} - Agendamento</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <div class="top-bar">
        <h1>{{ store.name }}</h1>
        <a href="/admin" class="btn-admin-link">Área Admin 🔒</a>
      </div>
      <p>{{ store.address }} | {{ store.phone }}</p>
    </header>

    <!-- Modal/Sessão de Identificação do Cliente -->
    <div id="user-bar" class="card user-bar">
      <div id="login-fields" class="user-fields">
        <span>👋 <strong>Faça seu acesso rápido:</strong></span>
        <input type="text" id="user-name-input" placeholder="Seu Nome Completo">
        <input type="tel" id="user-phone-input" placeholder="Seu WhatsApp">
        <button id="btn-save-user" class="btn-small">Entrar</button>
      </div>
      <div id="logged-fields" class="user-fields" style="display: none;">
        <span>✅ Conectado como: <strong id="logged-name"></strong> (<span id="logged-phone"></span>)</span>
        <button id="btn-change-user" class="btn-link">Alterar dados</button>
      </div>
    </div>

    <div class="main-content">
      <section class="card">
        <h2>Agendar Horário</h2>
        <div id="status-msg" class="status-message"></div>

        <form id="booking-form">
          <div class="form-group">
            <label for="service">Serviço</label>
            <select id="service" required>
              <option value="">Selecione um serviço...</option>
              {% for service in services %}
                <option value="{{ service.id }}">{{ service.name }} - {{ service.price }} ({{ service.duration }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="date">Data do Agendamento</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group">
            <label>Horários Disponíveis para esta Data</label>
            <div id="slots-container" class="slots-grid">
              <span class="text-muted">Selecione uma data para consultar</span>
            </div>
          </div>

          <button type="submit" class="btn-submit">Confirmar Agendamento</button>
        </form>
      </section>
    </div>
  </div>

  <script>
    let selectedTimeSlot = null;

    // Login do usuário no navegador (localStorage)
    const nameInput = document.getElementById('user-name-input');
    const phoneInput = document.getElementById('user-phone-input');
    const btnSaveUser = document.getElementById('btn-save-user');
    const btnChangeUser = document.getElementById('btn-change-user');
    const loginFields = document.getElementById('login-fields');
    const loggedFields = document.getElementById('logged-fields');
    const loggedName = document.getElementById('logged-name');
    const loggedPhone = document.getElementById('logged-phone');

    function checkUserLogin() {
      const name = localStorage.getItem('client_name');
      const phone = localStorage.getItem('client_phone');

      if (name && phone) {
        loggedName.textContent = name;
        loggedPhone.textContent = phone;
        loginFields.style.display = 'none';
        loggedFields.style.display = 'flex';
      } else {
        loginFields.style.display = 'flex';
        loggedFields.style.display = 'none';
      }
    }

    btnSaveUser.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      if (!name || !phone) {
        alert('Por favor, informe seu nome e telefone.');
        return;
      }
      localStorage.setItem('client_name', name);
      localStorage.setItem('client_phone', phone);
      checkUserLogin();
    });

    btnChangeUser.addEventListener('click', () => {
      localStorage.removeItem('client_name');
      localStorage.removeItem('client_phone');
      checkUserLogin();
    });

    checkUserLogin();

    // Data mínima hoje
    const dateInput = document.getElementById('date');
    const slotsContainer = document.getElementById('slots-container');
    const bookingForm = document.getElementById('booking-form');
    const statusMsg = document.getElementById('status-msg');

    dateInput.min = new Date().toISOString().split('T')[0];

    dateInput.addEventListener('change', fetchSlots);

    async function fetchSlots() {
      const selectedDate = dateInput.value;
      if (!selectedDate) return;

      selectedTimeSlot = null;
      slotsContainer.innerHTML = 'Carregando horários...';

      try {
        const response = await fetch(`/api/slots?date=${selectedDate}`);
        const data = await response.json();

        slotsContainer.innerHTML = '';

        if (data.status === 'closed') {
          slotsContainer.innerHTML = `<span class="text-danger">${data.message}</span>`;
          return;
        }

        if (!data.slots || data.slots.length === 0) {
          slotsContainer.innerHTML = '<span>Sem horários para esta data.</span>';
          return;
        }

        data.slots.forEach(slot => {
          const btn = document.createElement('button');
          btn.type = 'button';
          
          let statusText = slot.time;
          let btnClass = 'slot-btn';

          if (!slot.available) {
            btnClass += ' disabled';
            if (slot.reason === 'passado') statusText += ' (Expirado)';
            else if (slot.reason === 'reservado') statusText += ' (Ocupado)';
            else if (slot.reason === 'bloqueado') statusText += ' (Fechado)';
          }

          btn.className = btnClass;
          btn.textContent = statusText;

          if (slot.available) {
            btn.addEventListener('click', () => {
              document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
              selectedTimeSlot = slot.time;
            });
          }

          slotsContainer.appendChild(btn);
        });
      } catch (err) {
        slotsContainer.innerHTML = '<span class="text-danger">Erro ao carregar horários.</span>';
      }
    }

    bookingForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = localStorage.getItem('client_name');
      const phone = localStorage.getItem('client_phone');

      if (!name || !phone) {
        showStatus('Por favor, informe seu Nome e Telefone no topo da página antes de agendar.', 'error');
        return;
      }

      if (!selectedTimeSlot) {
        showStatus('Selecione um horário disponível.', 'error');
        return;
      }

      const payload = {
        service_id: document.getElementById('service').value,
        date: dateInput.value,
        time: selectedTimeSlot,
        client_name: name,
        client_phone: phone
      };

      try {
        const response = await fetch('/api/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showStatus('Agendamento realizado com sucesso!', 'success');
          selectedTimeSlot = null;
          fetchSlots(); // Atualiza a lista e remove o horário agendado!
        } else {
          showStatus(result.error || 'Erro ao realizar agendamento.', 'error');
        }
      } catch (err) {
        showStatus('Erro na requisição.', 'error');
      }
    });

    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = `status-message ${type}`;
    }
  </script>
</body>
</html>
