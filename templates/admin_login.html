<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Painel Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="align-items: center; min-height: 80vh;">
  <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
    <h2>Painel Administrativo 🔒</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Digite a senha para gerenciar a agenda</p>

    <div class="form-group">
      <input type="password" id="admin-pass" placeholder="Senha do Administrador">
    </div>
    <button id="btn-login" class="btn-submit">Acessar Painel</button>
    <a href="/" class="btn-link" style="display: block; margin-top: 15px;">← Voltar ao site</a>
  </div>

  <script>
    document.getElementById('btn-login').addEventListener('click', async () => {
      const password = document.getElementById('admin-pass').value;
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      if (res.ok) {
        window.location.reload();
      } else {
        alert('Senha incorreta!');
      }
    });
  </script>
</body>
</html>
